  <circle cx="39" cy="36" r="5" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <line x1="29" y1="31" x2="35" y2="33" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
</svg>
